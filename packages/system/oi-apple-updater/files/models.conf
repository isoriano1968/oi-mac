#
# OI-Apple Updater: which group packages (group/apple/<name>) each Mac gets.
# Read by /usr/sbin/oi-apple-update.  First matching line wins; the model is
# smbios -t SMB_TYPE_SYSTEM "Product", matched as a shell pattern.
#
# model <pattern>  <groups...>
# pci   <vendor,device>  <groups...>   added when prtconf shows the device
# no-pci <vendor>  <group>             removed when any device of the vendor
#                                      is present (e.g. NVIDIA: OI's Xorg)
# osnet <version>                      the osnet build oi-local's kernel
#                                      packages are built for
#
osnet	0.5.11-2026.0.0.23395

model	MacPro6,1		base smc audio storage desktop gfx-stack drm-amdgpu-si
model	iMac14,1		base smc audio storage desktop gfx-stack drm-i915n
model	iMac13,2		base smc audio storage desktop
model	iMac18,*		base smc audio storage desktop gfx-stack
model	iMac19,*		base smc audio storage desktop gfx-stack
model	MacBookPro14,*		base smc audio storage desktop gfx-stack macbook
model	*			base smc audio storage

# Refinement by the graphics hardware present.
pci	1002,679e		drm-amdgpu-si
pci	8086,0d22		drm-i915n
no-pci	10de			gfx-stack
