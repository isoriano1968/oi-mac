# system/oi-apple-live: X reads the console keyboard and mouse multiplexers
# instead of HAL's device list.  HAL lists only an i8042 keyboard (the
# MacBooks have none: atopcase's internal keyboard is linked under conskbd,
# so it is only in /dev/kbd) and USB HID devices, and with HAL hotplug on,
# X disables every 'kbd'/'mouse' device from xorg.conf.d, including the
# atopcase trackpad.  /dev/kbd carries the internal and all USB keyboards,
# /dev/mouse all USB mice; the trackpad is /dev/atopcase/mouse.
Section "ServerFlags"
	Option		"AutoAddDevices"	"false"
EndSection

Section "InputDevice"
	Identifier	"Console keyboard"
	Driver		"kbd"
	Option		"Device"		"/dev/kbd"
	Option		"XkbRules"		"base"
	Option		"XkbModel"		"sun_type6_usb"
	Option		"XkbLayout"		"us"
	Option		"AutoServerLayout"	"on"
	Option		"CoreKeyboard"
EndSection

Section "InputDevice"
	Identifier	"Console mouse"
	Driver		"mouse"
	Option		"Device"		"/dev/mouse"
	Option		"Protocol"		"VUID"
	Option		"ZAxisMapping"		"4 5"
	Option		"AutoServerLayout"	"on"
	Option		"CorePointer"
EndSection
