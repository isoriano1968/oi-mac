# system/oi-apple-live, live media only (svc:/system/oi-apple-live links it
# into /etc/X11/xorg.conf.d when /.livecd exists): X on the firmware
# framebuffer the kernel console uses.  illumosfb's default /dev/fb0 can be
# a stale link on an image built in a virtual machine.
Section "Device"
	Identifier	"illumosfb"
	Driver		"illumosfb"
	Option		"Device"	"/dev/fb"
EndSection
