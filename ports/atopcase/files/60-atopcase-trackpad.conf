# driver/input/atopcase: the internal trackpad of the MacBook (Pro)
# 2015-2017 as a relative mouse.  atopcase(4D) gives VUID Firm_events
# (deltas, buttons, wheel) on /dev/atopcase/mouse; the stream is not under
# consms, so Xorg reads it here.  AutoServerLayout adds it to the layout
# X builds when there is no xorg.conf.
Section "InputDevice"
	Identifier	"atopcase trackpad"
	Driver		"mouse"
	Option		"Device"		"/dev/atopcase/mouse"
	Option		"Protocol"		"VUID"
	Option		"AutoServerLayout"	"on"
	Option		"ZAxisMapping"		"4 5"
EndSection
